<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview History</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="background-effects.css">
    <style>
        .history-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
        .history-item { background: var(--bg-surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-subtle); cursor: pointer; }
        .history-details { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle); }
        .history-details.active { display: block; }
        .history-qa { display: flex; flex-direction: column; gap: 1rem; }
        .history-eval { margin-top: 2rem; }
        .role-bot { color: var(--primary); font-weight: bold; }
        .role-user { color: var(--text-primary); font-weight: bold; }
    </style>
</head>
<body>

<main class="home-container">
    <header class="home-header">
        <div>
            <p class="eyebrow"><a href="index.html" style="color: inherit; text-decoration: none;">← BACK TO HOME</a></p>
            <h1>Interview History</h1>
            <p class="home-subtitle">Review your past interviews and evaluations.</p>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div id="auth-container"></div>
            <button type="button" id="themeToggle" class="theme-toggle">🌙 Dark</button>
        </div>
    </header>

    <section class="features-section">
        <div id="history-container" class="history-list">
            <p>Loading history...</p>
        </div>
    </section>
</main>

<script src="auth.js"></script>
<script src="history.js"></script>
<script src="script.js"></script>
<script src="background-effects.js"></script>
</body>
</html>
