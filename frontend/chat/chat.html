<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Interview — Chat
    </title>

    <link
        rel="stylesheet"
        href="chat.css"
    >
    <link rel="stylesheet" href="../background-effects.css">

</head>


<body>

<main class="chat-app">

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <header class="chat-header">

        <div class="header-left">

            <a
                href="index.html"
                class="back-button"
                id="backButton"
            >
                ←
            </a>


            <div class="interviewer-avatar">
                AI
            </div>


            <div class="header-info">

                <strong>
                    AI Interviewer
                </strong>

                <span id="roleLabel">
                    Technical Interview
                </span>

            </div>

        </div>


        <div class="header-right">

            <div
                class="timer"
                id="timer"
            >
                00:00
            </div>


            <button
                type="button"
                id="themeToggle"
                class="theme-toggle"
                aria-label="Toggle theme"
            >
                🌙
            </button>

        </div>

    </header>


    <!-- ================================================= -->
    <!-- INTERVIEW STATUS -->
    <!-- ================================================= -->

    <div
        id="interviewStatus"
        class="interview-status hidden"
    ></div>


    <!-- ================================================= -->
    <!-- CHAT AREA -->
    <!-- ================================================= -->

    <section
        id="chatMessages"
        class="chat-messages"
        aria-live="polite"
    >

        <!-- Messages are inserted by chat.js -->

    </section>


    <!-- ================================================= -->
    <!-- THINKING INDICATOR -->
    <!-- ================================================= -->

    <div
        id="thinkingIndicator"
        class="thinking-indicator hidden"
    >

        <div class="message-avatar">
            AI
        </div>

        <div class="thinking-bubble">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- COMPOSER -->
    <!-- ================================================= -->

    <section
        class="composer-area"
        id="composerArea"
    >

        <div class="composer">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Type your answer..."
                autocomplete="off"
                maxlength="5000"
            ></textarea>


            <button
                type="button"
                id="sendButton"
                class="send-button"
                aria-label="Send message"
            >
                <span>
                    Send
                </span>

                <span>
                    →
                </span>
            </button>

        </div>


        <div class="composer-footer">

            <span>
                Keep your answers focused and conversational.
            </span>

            <span id="messageCounter">
                0 / 5000
            </span>

        </div>

    </section>


    <!-- ================================================= -->
    <!-- COMPLETION -->
    <!-- ================================================= -->

    <section
        id="completionPanel"
        class="completion-panel hidden"
    >

        <div class="completion-icon">
            ✓
        </div>


        <p class="eyebrow">
            INTERVIEW COMPLETE
        </p>


        <h1>
            Your interview is finished
        </h1>


        <p>
            Your conversation has been recorded.
            Let's generate your final interview report.
        </p>


        <button
            type="button"
            id="viewResultButton"
            class="result-button"
        >
            View Final Report
            <span>→</span>
        </button>

    </section>

</main>

</body>

</html>
